<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisQL | Zero-Trust Data Bastion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a' },
            dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex flex-col font-sans" x-data="aegisApp()">

  <!-- Top Navigation -->
  <header class="border-b border-slate-800 bg-dark-900 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xl tracking-wider text-white shadow-lg shadow-blue-500/30">
        🛡️
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          AegisQL <span class="text-xs px-2 py-0.5 rounded bg-blue-900/60 text-blue-400 border border-blue-700/50 font-mono">Zero-Trust JIT Bastion</span>
        </h1>
      </div>
    </div>

    <!-- Right Header Actions -->
    <div class="flex items-center space-x-6">
      
      <!-- Language Toggle -->
      <div class="flex items-center gap-2 text-xs font-semibold bg-dark-800 border border-slate-700 rounded-lg p-1">
        <button @click="currentLang = 'en'" :class="currentLang === 'en' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'" class="px-2 py-1 rounded transition">EN</button>
        <button @click="currentLang = 'id'" :class="currentLang === 'id' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'" class="px-2 py-1 rounded transition">ID</button>
      </div>

      <!-- Active Session Widget -->
      <div>
        <template x-if="session.active">
          <div class="flex items-center gap-3 bg-dark-800 border border-slate-700 rounded-lg px-3 py-1.5 shadow-sm">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <div class="text-xs">
              <span class="text-slate-400" x-text="i18n[currentLang].operator + ':'"></span> <strong class="text-slate-200" x-text="session.username"></strong>
              <span class="mx-2 text-slate-600">|</span>
              <span class="text-slate-400">TTL:</span> <span class="font-mono text-emerald-400 font-bold" x-text="formatTime(session.remainingSeconds)"></span>
            </div>
            <button @click="revokeSession()" class="text-xs text-rose-400 hover:text-rose-300 font-medium ml-2 px-2 py-0.5 rounded hover:bg-rose-950/40" x-text="i18n[currentLang].revokeBtn"></button>
          </div>
        </template>

        <template x-if="!session.active">
          <button @click="showRequestModal = true" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-4 py-2 rounded-md shadow transition" x-text="i18n[currentLang].requestBtn"></button>
        </template>
      </div>
    </div>
  </header>

  <!-- Main Grid Workspace -->
  <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl w-full mx-auto">
    
    <!-- SQL Execution Workspace (Cols 2) -->
    <section class="lg:col-span-2 flex flex-col gap-4">
      
      <!-- Query Editor Container -->
      <div class="bg-dark-900 border border-slate-800 rounded-xl p-4 shadow-sm flex flex-col gap-3">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="i18n[currentLang].consoleTitle"></span>
          <span class="text-xs text-slate-500 font-mono" x-text="i18n[currentLang].guardrailActive"></span>
        </div>
        
        <textarea 
          x-model="queryInput" 
          :disabled="!session.active"
          rows="4" 
          class="w-full bg-dark-950 border border-slate-700 rounded-lg p-3 font-mono text-sm text-slate-200 focus:outline-none focus:border-blue-500 transition disabled:opacity-50 disabled:cursor-not-allowed"
          :placeholder="i18n[currentLang].queryPlaceholder"></textarea>

        <div class="flex justify-between items-center pt-1">
          <div class="text-xs text-slate-400">
            <template x-if="statusMessage">
              <span :class="statusIsError ? 'text-rose-400' : 'text-emerald-400'" x-text="statusMessage"></span>
            </template>
          </div>
          <button 
            @click="runQuery()" 
            :disabled="!session.active || isExecuting"
            class="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-medium text-xs px-5 py-2 rounded-lg flex items-center gap-2 shadow-sm transition">
            <span x-show="!isExecuting">⚡ <span x-text="i18n[currentLang].executeBtn"></span></span>
            <span x-show="isExecuting" x-text="i18n[currentLang].executingStatus"></span>
          </button>
        </div>
      </div>

      <!-- Result Data Table -->
      <div class="bg-dark-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col shadow-sm min-h-[300px] overflow-hidden">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="i18n[currentLang].resultViewTitle"></span>
          <div class="text-xs text-slate-500 space-x-3">
            <span><span x-text="i18n[currentLang].rows"></span>: <strong class="text-slate-300" x-text="queryResult.rows.length"></strong></span>
            <span><span x-text="i18n[currentLang].latency"></span>: <strong class="text-slate-300" x-text="queryResult.latency + ' ms'"></strong></span>
          </div>
        </div>

        <div class="flex-1 overflow-auto rounded-lg border border-slate-800">
          <table class="w-full text-left text-xs font-mono">
            <thead class="bg-dark-800 text-slate-400 uppercase text-[10px]">
              <tr>
                <template x-for="col in queryResult.columns" :key="col">
                  <th class="px-3 py-2 border-b border-slate-700 whitespace-nowrap" x-text="col"></th>
                </template>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800">
              <template x-for="(row, idx) in queryResult.rows" :key="idx">
                <tr class="hover:bg-dark-800/40">
                  <template x-for="col in queryResult.columns" :key="col">
                    <td class="px-3 py-2 text-slate-300 whitespace-nowrap" x-text="row[col]"></td>
                  </template>
                </tr>
              </template>
              <tr x-show="queryResult.rows.length === 0">
                <td colspan="100" class="text-center py-12 text-slate-600 font-sans" x-text="i18n[currentLang].emptyResult"></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>

    <!-- Audit & Security Sentinel (Col 1) -->
    <aside class="flex flex-col gap-4">
      <div class="bg-dark-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col shadow-sm">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2 mb-3">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-400" x-text="i18n[currentLang].auditTitle"></span>
          <button @click="verifyLedger()" class="text-[11px] text-blue-400 hover:underline" x-text="i18n[currentLang].verifyLedgerBtn"></button>
        </div>

        <div class="flex-1 overflow-y-auto space-y-2 pr-1 max-h-[500px]">
          <template x-for="log in auditLogs" :key="log.current_hash">
            <div class="p-2.5 rounded bg-dark-950 border border-slate-800 text-[11px] flex flex-col gap-1">
              <div class="flex justify-between text-slate-400">
                <span class="font-medium text-slate-300" x-text="log.username"></span>
                <span class="font-mono text-[10px] text-slate-500" x-text="log.timestamp.substring(11, 19) + ' UTC'"></span>
              </div>
              <div class="font-mono text-slate-300 bg-dark-900 px-1.5 py-0.5 rounded text-[10px] truncate" x-text="log.sanitized_sql"></div>
              <div class="text-[9px] font-mono text-slate-500 truncate" title="SHA-256 Hash">
                Hash: <span class="text-blue-400" x-text="log.current_hash.substring(0, 16) + '...'"></span>
              </div>
            </div>
          </template>
          <div x-show="auditLogs.length === 0" class="text-center py-8 text-slate-600 text-xs" x-text="i18n[currentLang].emptyAudit"></div>
        </div>
      </div>
    </aside>

  </main>

  <!-- Modal Request Session -->
  <div x-show="showRequestModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-dark-900 border border-slate-700 rounded-xl max-w-md w-full p-6 shadow-2xl" @click.away="showRequestModal = false">
      <h3 class="text-lg font-bold text-white mb-1" x-text="i18n[currentLang].modalTitle"></h3>
      <p class="text-xs text-slate-400 mb-4" x-text="i18n[currentLang].modalSubtitle"></p>
      
      <div class="space-y-3">
        <div>
          <label class="text-xs text-slate-300 block mb-1" x-text="i18n[currentLang].lblUsername"></label>
          <input type="text" x-model="modalForm.username" class="w-full bg-dark-950 border border-slate-700 rounded p-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-xs text-slate-300 block mb-1" x-text="i18n[currentLang].lblJustification"></label>
          <textarea x-model="modalForm.justification" rows="2" class="w-full bg-dark-950 border border-slate-700 rounded p-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500" :placeholder="i18n[currentLang].phJustification"></textarea>
        </div>
        <div>
          <label class="text-xs text-slate-300 block mb-1" x-text="i18n[currentLang].lblDuration"></label>
          <input type="number" x-model.number="modalForm.duration" min="1" max="60" class="w-full bg-dark-950 border border-slate-700 rounded p-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <button @click="showRequestModal = false" class="px-4 py-2 rounded text-xs text-slate-400 hover:text-white" x-text="i18n[currentLang].btnCancel"></button>
        <button @click="createSession()" class="px-4 py-2 rounded text-xs bg-blue-600 hover:bg-blue-500 text-white font-semibold" x-text="i18n[currentLang].btnGenerate"></button>
      </div>
    </div>
  </div>

  <script>
    function aegisApp() {
      return {
        currentLang: 'en', // Default language
        i18n: {
          en: {
            requestBtn: "Request JIT Access",
            operator: "Operator",
            revokeBtn: "Revoke",
            consoleTitle: "SQL Interrogation Console",
            guardrailActive: "AST Guardrail & Limit Injection Active",
            queryPlaceholder: "-- Enter your query (e.g., SELECT * FROM corporate_taxpayers)",
            executeBtn: "Execute Interrogation",
            executingStatus: "Executing...",
            resultViewTitle: "Result View (Auto-Masked)",
            rows: "Rows",
            latency: "Latency",
            emptyResult: "No dataset loaded. Request an access session and execute a query.",
            auditTitle: "Audit Trail (Hash Chain)",
            verifyLedgerBtn: "Verify Integrity",
            emptyAudit: "No audit trails recorded yet.",
            modalTitle: "Request Just-In-Time Access",
            modalSubtitle: "Time-bound access session with automatic query sanitation and audit logging.",
            lblUsername: "Username / Operator",
            lblJustification: "Business Justification",
            lblDuration: "Access Duration (Minutes)",
            phJustification: "E.g., Q3 tax transaction reconciliation",
            btnCancel: "Cancel",
            btnGenerate: "Generate Session",
            msgSessionActive: "JIT session active. Guardrail ready.",
            msgSessionExpired: "JIT session expired. Access locked.",
            msgSessionRevoked: "Session successfully revoked.",
            msgQuerySuccess: "Query successfully sanitized and executed.",
            msgNetError: "Network error occurred.",
            msgCreateFail: "Failed to generate JIT session.",
            msgValidChain: "VALID (Intact Hash Chain)",
            msgCompromised: "COMPROMISED",
            msgTotalRecords: "Total Records"
          },
          id: {
            requestBtn: "Minta Akses JIT",
            operator: "Operator",
            revokeBtn: "Cabut",
            consoleTitle: "Konsol Interogasi SQL",
            guardrailActive: "AST Guardrail & Limit Injection Aktif",
            queryPlaceholder: "-- Ketik query Anda (misal: SELECT * FROM corporate_taxpayers)",
            executeBtn: "Eksekusi Interogasi",
            executingStatus: "Mengeksekusi...",
            resultViewTitle: "Tampilan Hasil (Auto-Masked)",
            rows: "Baris",
            latency: "Latensi",
            emptyResult: "Belum ada dataset yang dimuat. Minta sesi akses dan jalankan query.",
            auditTitle: "Jejak Audit (Hash Chain)",
            verifyLedgerBtn: "Verifikasi Integritas",
            emptyAudit: "Belum ada jejak audit tercatat.",
            modalTitle: "Permintaan Akses Just-In-Time",
            modalSubtitle: "Sesi akses berbatas waktu dengan audit logging dan sanitasi query otomatis.",
            lblUsername: "Nama Pengguna / Operator",
            lblJustification: "Justifikasi Bisnis",
            lblDuration: "Durasi Akses (Menit)",
            phJustification: "Contoh: Rekonsiliasi transaksi pajak Q3",
            btnCancel: "Batal",
            btnGenerate: "Hasilkan Sesi",
            msgSessionActive: "Sesi JIT aktif. Guardrail siap.",
            msgSessionExpired: "Sesi JIT telah kedaluwarsa. Akses dikunci.",
            msgSessionRevoked: "Sesi telah berhasil dicabut.",
            msgQuerySuccess: "Query sukses disanitasi dan dieksekusi.",
            msgNetError: "Terjadi kesalahan jaringan.",
            msgCreateFail: "Gagal membuat sesi JIT.",
            msgValidChain: "VALID (Rantai Hash Utuh)",
            msgCompromised: "TERKOMPROMISI",
            msgTotalRecords: "Total Record"
          }
        },
        showRequestModal: false,
        isExecuting: false,
        statusMessage: '',
        statusIsError: false,
        queryInput: 'SELECT * FROM corporate_taxpayers',
        modalForm: { username: 'dhani.analyst', justification: '', duration: 15 },
        session: { id: null, active: false, username: '', remainingSeconds: 0 },
        queryResult: { columns: [], rows: [], latency: 0 },
        auditLogs: [],
        timerInterval: null,

        init() {
          this.fetchAuditLogs();
        },

        getHeaders(includeSession = false) {
          const headers = {
            'Content-Type': 'application/json',
            'Accept-Language': this.currentLang
          };
          if (includeSession && this.session.id) {
            headers['X-Session-ID'] = this.session.id;
          }
          return headers;
        },

        async createSession() {
          try {
            const res = await fetch('/api/v1/sessions/request', {
              method: 'POST',
              headers: this.getHeaders(),
              body: JSON.stringify({
                username: this.modalForm.username,
                justification: this.modalForm.justification,
                duration_minutes: this.modalForm.duration
              })
            });
            const data = await res.json();
            this.session.id = data.session_id;
            this.session.username = data.username;
            this.session.remainingSeconds = data.remaining_seconds;
            this.session.active = true;
            this.showRequestModal = false;
            this.startCountdown();
            this.statusMessage = this.i18n[this.currentLang].msgSessionActive;
            this.statusIsError = false;
          } catch (e) {
            alert(this.i18n[this.currentLang].msgCreateFail);
          }
        },

        startCountdown() {
          clearInterval(this.timerInterval);
          this.timerInterval = setInterval(() => {
            if (this.session.remainingSeconds > 0) {
              this.session.remainingSeconds--;
            } else {
              this.session.active = false;
              clearInterval(this.timerInterval);
              this.statusMessage = this.i18n[this.currentLang].msgSessionExpired;
              this.statusIsError = true;
            }
          }, 1000);
        },

        async revokeSession() {
          if (!this.session.id) return;
          await fetch(`/api/v1/sessions/${this.session.id}/revoke`, { 
            method: 'POST',
            headers: this.getHeaders()
          });
          this.session.active = false;
          this.session.remainingSeconds = 0;
          clearInterval(this.timerInterval);
          this.statusMessage = this.i18n[this.currentLang].msgSessionRevoked;
          this.statusIsError = true;
        },

        async runQuery() {
          this.isExecuting = true;
          this.statusMessage = '';
          try {
            const res = await fetch('/api/v1/query/execute', {
              method: 'POST',
              headers: this.getHeaders(true),
              body: JSON.stringify({ sql: this.queryInput })
            });
            const json = await res.json();
            if (!res.ok) {
              this.statusIsError = true;
              this.statusMessage = json.detail.message || json.detail.reason || 'Execution rejected.';
              return;
            }
            this.queryResult.rows = json.data;
            this.queryResult.columns = json.data.length > 0 ? Object.keys(json.data[0]) : [];
            this.queryResult.latency = json.execution_time_ms;
            this.statusIsError = false;
            this.statusMessage = this.i18n[this.currentLang].msgQuerySuccess;
            this.fetchAuditLogs();
          } catch (e) {
            this.statusIsError = true;
            this.statusMessage = this.i18n[this.currentLang].msgNetError;
          } finally {
            this.isExecuting = false;
          }
        },

        async fetchAuditLogs() {
          try {
            const res = await fetch('/api/v1/audit/logs', { headers: this.getHeaders() });
            this.auditLogs = await res.json();
          } catch (e) {}
        },

        async verifyLedger() {
          const res = await fetch('/api/v1/audit/verify', { headers: this.getHeaders() });
          const data = await res.json();
          const statusTxt = data.is_valid ? this.i18n[this.currentLang].msgValidChain : this.i18n[this.currentLang].msgCompromised;
          alert(`Integrity: ${statusTxt}\n${this.i18n[this.currentLang].msgTotalRecords}: ${data.total_records}`);
        },

        formatTime(seconds) {
          const m = Math.floor(seconds / 60);
          const s = seconds % 60;
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
      }
    }
  </script>
</body>
</html>
